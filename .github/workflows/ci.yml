name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ./frontend/yarn.lock
      - run: yarn install
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx jest --ci
      - run: npx expo-doctor
