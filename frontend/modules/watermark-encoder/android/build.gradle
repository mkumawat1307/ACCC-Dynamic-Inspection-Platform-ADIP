apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.watermarkencoder'
version = '0.1.0'

android {
  namespace "expo.modules.watermarkencoder"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.exifinterface:exifinterface:1.4.1'
}